name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: 10c3/anidan
  PUBLISH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}

jobs:
  docker:
    name: Build amd64 and arm64 image
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check publishing credentials
        if: env.PUBLISH == 'true'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys

          def fail(message):
              print("::error::" + message)
              sys.exit(1)

          username = os.environ.get("DOCKER_USERNAME", "")
          token = os.environ.get("DOCKER_PASSWORD", "")
          if not username or not token:
              fail("Set both DOCKER_USERNAME and DOCKER_PASSWORD in repository Actions Secrets.")
          if not re.fullmatch(r"[a-z0-9][a-z0-9_-]*", username):
              fail("DOCKER_USERNAME must be your Docker Hub username (for example 10c3), without an email, URL, quotes or whitespace.")
          if any(ch.isspace() or ord(ch) < 32 or ord(ch) == 127 for ch in token):
              fail("DOCKER_PASSWORD contains whitespace or control characters. Paste only the Docker Hub Access Token, not a login command or Authorization header.")
          if token.startswith(("\"", "'", "DOCKER_PASSWORD=", "password=")) or token.endswith(("\"", "'")):
              fail("DOCKER_PASSWORD must contain the raw Docker Hub Access Token, without quotes or a variable assignment.")
          print("Credential format checked; Docker Hub login will verify whether the credentials are valid.")
          PY

      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64

      - name: Set up Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Layer caching alone cannot reuse compiled packages after source edits.
      # Keep this outside the checkout so it never enters the image/source archive.
      - name: Restore Go compiler cache
        id: go-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/anidan-go-build-cache
          key: ${{ runner.os }}-${{ runner.arch }}-buildx-go-v1-${{ hashFiles('Dockerfile', 'go.mod', 'go.sum') }}-${{ hashFiles('cmd/**/*.go', 'internal/**/*.go') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-buildx-go-v1-${{ hashFiles('Dockerfile', 'go.mod', 'go.sum') }}-
            ${{ runner.os }}-${{ runner.arch }}-buildx-go-v1-

      # Its post step extracts the mount before actions/cache saves it and
      # before setup-buildx removes the builder (post steps run in reverse).
      - name: Inject Go compiler cache into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          scratch-dir: ${{ runner.temp }}/anidan-cache-dance
          cache-map: |
            {
              "${{ runner.temp }}/anidan-go-build-cache": {
                "target": "/root/.cache/go-build",
                "id": "anidan-go-build"
              }
            }
          skip-extraction: ${{ steps.go-cache.outputs.cache-hit == 'true' }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - name: Build and publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ANIDAN_SOURCE_URL=/source-code
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Published image
        if: env.PUBLISH == 'true'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          printf '### Published Docker images\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$IMAGE_TAGS" | while IFS= read -r tag; do
            printf -- '- `%s`\n' "$tag" >> "$GITHUB_STEP_SUMMARY"
          done
