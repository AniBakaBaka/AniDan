# Start: docker compose up -d --build
# Open http://localhost:7769 and complete the database/admin setup.
# Installation code: docker compose logs anidan
services:
  anidan:
    image: ${ANIDAN_IMAGE:-10c3/anidan:latest}
    build:
      context: .
      args:
        ANIDAN_SOURCE_URL: ${ANIDAN_SOURCE_URL:-/source-code}
    restart: unless-stopped
    init: true
    # Read/write existing Misaka bind mounts without changing their ownership.
    user: "0:0"
    ports:
      - "${ANIDAN_BIND_IP:-0.0.0.0}:${ANIDAN_PORT:-7769}:7769"
    environment:
      ANIDAN_LISTEN: ":7769"
      ANIDAN_CONFIG_DIR: /data
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      - anidan-data:/data
      # To reuse Misaka, uncomment and point to its complete config directory.
      # Stop the original application before connecting its database here.
      # - /absolute/path/to/misaka/config:/app/config
      # If connection/JWT settings are in the original Compose, also mount it:
      # - /absolute/path/to/misaka/docker-compose.yml:/app/config/docker-compose.yml:ro
      # Setup reads both files automatically; no export or credential re-entry.
      # Keep the original SQL server running and reachable from this container.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  anidan-data:
